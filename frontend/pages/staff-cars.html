<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff: cars - CarRent Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
  <style>
    :root {
      --crimson: #a3164a;   --pink: #c2255c;      --pink-line: #e9b8c8;  --pink-soft: #fdeef3;
      --green: #1d5e3a;     --green-btn: #c8ecd6; --green-line: #5fae84; --mint: #eefaf3;
      --yellow-btn: #f7f0b6; --yellow-line: #d6c65a; --yellow-bar: #fbf6cf;
      --ink: #2a2a2a;       --muted: #555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
      background: linear-gradient(135deg, #fdf0f5 0%, #fffbe8 45%, #e8f6ee 100%) fixed;
    }
    header {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 28px;
      background: linear-gradient(90deg, #fffbe0, var(--yellow-bar) 60%, #fdeef3);
      border-bottom: 2px solid var(--yellow-line);
    }
    header .brand { font-size: 24px; font-weight: 700; color: var(--crimson); text-decoration: none; margin-right: auto; }
    header nav { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    header nav a { color: var(--pink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
    header nav a:hover, header nav a[aria-current="page"] { color: var(--crimson); }
    main {
      max-width: 1040px; margin: 32px auto; padding: 30px 32px; border-radius: 24px;
      background: linear-gradient(160deg, var(--mint) 0%, #fffdf0 60%, #fdf1f5 100%);
      border: 1.5px solid #cfe9db; box-shadow: 0 6px 24px rgba(29, 94, 58, .08);
    }
    h1 { color: var(--crimson); font-size: 40px; margin: 0 0 10px; }
    h2 { color: var(--crimson); margin-top: 34px; }
    .intro { color: var(--muted); font-size: 18px; margin: 0 0 20px; }
    form.filters, form.panel { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin: 0; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; color: var(--green); font-size: 16px; }
    input, select {
      font: inherit; font-size: 16px; padding: 10px 12px; min-width: 170px; color: var(--ink);
      border: 1.5px solid var(--pink-line); border-radius: 12px; background: rgba(255, 255, 255, .85);
    }
    input:focus, select:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
    button, a.button {
      font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); cursor: pointer; text-decoration: none;
      display: inline-block; padding: 10px 20px; border-radius: 14px;
      background: var(--green-btn); border: 1.5px solid var(--green-line);
    }
    button:hover, a.button:hover { filter: brightness(.96); }
    button.secondary, a.button.secondary { background: var(--yellow-btn); border-color: var(--yellow-line); }
    button.danger { background: transparent; border-color: var(--pink-line); color: var(--crimson); }
    button.danger:hover { background: var(--pink-soft); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, a.button:focus-visible, header nav a:focus-visible { outline: 3px solid var(--pink-line); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin: 22px 0 0; padding: 0; list-style: none; }
    .card { background: rgba(255, 255, 255, .8); border: 1.5px solid #cfe9db; border-radius: 18px; padding: 18px; }
    .card:nth-child(3n+2) { border-color: var(--pink-line); }
    .card:nth-child(3n) { border-color: var(--yellow-line); }
    .card h3 { margin: 0 0 6px; color: var(--crimson); font-size: 22px; }
    .muted { color: var(--muted); margin: 0 0 10px; }
    .price { display: inline-block; font-weight: 700; color: var(--green); background: var(--yellow-btn); border: 1.5px solid var(--yellow-line); padding: 2px 12px; border-radius: 12px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .details { margin-top: 12px; padding: 10px 14px; background: var(--mint); border: 1px solid #cfe9db; border-radius: 12px; }
    .details p { margin: 4px 0; }
    .msg { margin: 16px 0; padding: 10px 16px; border-radius: 14px; background: var(--yellow-bar); border: 1px solid var(--yellow-line); }
    .msg.error, .error { color: var(--crimson); }
    .msg.error { background: var(--pink-soft); border-color: var(--pink-line); }
    .msg.ok { color: var(--green); background: var(--mint); border-color: var(--green-line); }
    .msg.warn { color: #7a5b00; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; background: rgba(255, 255, 255, .8); border: 1.5px solid #cfe9db; border-radius: 18px; overflow: hidden; }
    th { text-align: left; padding: 12px; color: var(--green); background: var(--mint); border-bottom: 1.5px solid #cfe9db; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0e6c8; }
    tr:last-child td { border-bottom: 0; }
    tr.retired { color: #9a9a9a; }
    td input, td select { min-width: 0; width: 120px; padding: 6px 8px; }
    #map { height: 400px; border-radius: 18px; margin-top: 20px; border: 1.5px solid var(--green-line); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../index.html">CarRent Cloud</a>
    <nav>
      <a href="search.html">Search cars</a>
      <a href="offices-map.html">Offices</a>
      <a href="my-bookings.html">My bookings</a>
      <a href="staff-cars.html" aria-current="page">Staff: cars</a>
      <a href="staff-office.html">Staff: office</a>
      <a href="../login.html">Log in</a>
    </nav>
  </header>
  <main>
    <h1>My office's cars</h1>
    <p class="intro">Change prices and status, add new cars, or retire old ones.</p>
    <form class="panel" onsubmit="return false">
      <label>My office <select id="staff-office"></select></label>
    </form>
    <p id="cars-msg" class="msg" hidden></p>
    <table>
      <thead><tr><th>Plate</th><th>Car</th><th>Category</th><th>Price / day</th><th>Status</th><th></th></tr></thead>
      <tbody id="cars-body"></tbody>
    </table>

    <h2>Add a car</h2>
    <form id="add-form" class="panel">
      <label>Plate <input id="new-plate" required minlength="2" maxlength="15" pattern="[A-Za-z0-9؀-ۿ \-]+"></label>
      <label>Make <input id="new-make" required maxlength="40"></label>
      <label>Model <input id="new-model" required maxlength="40"></label>
      <label>Category <select id="new-category"></select></label>
      <label>Price / day (EGP) <input id="new-price" type="number" required min="1" max="100000" step="0.01"></label>
      <button type="submit">Add car</button>
    </form>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/catalogue.js"></script>
  <script>Catalogue.initStaffCarsPage();</script>
</body>
</html>
