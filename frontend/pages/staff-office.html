<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.execute-api.eu-central-1.amazonaws.com http://*.execute-api.localhost.floci.io:4566 https://*.amazoncognito.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <title>Staff: office - CarRent Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="../css/catalogue.css">
</head>
<body>
  <header>
    <a class="brand" href="../index.html">CarRent Cloud</a>
    <nav>
      <a href="search.html">Search cars</a>
      <a href="offices-map.html">Offices</a>
      <a href="my-bookings.html">My bookings</a>
      <a href="staff-cars.html">Staff: cars</a>
      <a href="staff-office.html" aria-current="page">Staff: office</a>
      <a href="../login.html">Log in</a>
    </nav>
  </header>
  <main>
    <h1>My office</h1>
    <p class="intro">Update your office's details. A new address is placed on the map automatically.</p>
    <form class="panel" onsubmit="return false">
      <label>My office <select id="staff-office"></select></label>
    </form>
    <p id="office-msg" class="msg" hidden></p>
    <form id="office-form" class="panel" hidden>
      <label>Name <input id="office-name" required minlength="2" maxlength="100"></label>
      <label>Address <input id="office-address" required minlength="5" maxlength="200"></label>
      <label>City <input id="office-city" required minlength="2" maxlength="60"></label>
      <label>Phone <input id="office-phone" maxlength="20" pattern="[+0-9 \(\)\-]{6,20}"></label>
      <button type="submit">Save</button>
    </form>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/catalogue.js" data-page="staff-office"></script>
</body>
</html>
