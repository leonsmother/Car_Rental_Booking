<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.execute-api.eu-central-1.amazonaws.com http://*.execute-api.localhost.floci.io:4566 https://*.amazoncognito.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Search cars - CarRent Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="../css/catalogue.css">
</head>
<body>
  <header>
    <a class="brand" href="../index.html">CarRent Cloud</a>
    <nav>
      <a href="search.html" aria-current="page">Search cars</a>
      <a href="offices-map.html">Offices</a>
      <a href="my-bookings.html">My bookings</a>
      <a href="staff-cars.html">Staff: cars</a>
      <a href="staff-office.html">Staff: office</a>
      <a href="../login.html">Log in</a>
    </nav>
  </header>
  <main>
    <h1>Find a car</h1>
    <p class="intro">Pick what you need and when. Prices are per day, in EGP.</p>
    <form id="search-form" class="filters">
      <label>Category <select id="category"></select></label>
      <label>Office <select id="office"><option value="">All offices</option></select></label>
      <label>Max price / day (EGP) <input id="maxPrice" type="number" min="1" step="1" placeholder="e.g. 1500"></label>
      <label>Pick-up <input id="from" type="date"></label>
      <label>Return <input id="to" type="date"></label>
      <button type="submit">Search</button>
    </form>
    <p id="search-msg" class="msg" hidden></p>
    <section id="results" class="grid"></section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/catalogue.js" data-page="search"></script>
</body>
</html>
