<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.s3.eu-central-1.amazonaws.com; connect-src 'self' https://*.amazoncognito.com https://*.execute-api.eu-central-1.amazonaws.com https://*.s3.eu-central-1.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <title>Pick-up inspection - CarRent Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">CarRent Cloud</a>
    <nav>
      <a href="/pages/pickup.html" data-role="staff" hidden>Pick-up</a>
      <a href="/pages/return.html" data-role="staff" hidden>Return</a>
      <a href="/pages/damage.html" data-role="staff" hidden>Damage flags</a>
      <a href="/pages/my-bookings.html" data-role="customer" hidden>My bookings</a>
    </nav>
    <span class="who" data-user-email></span>
    <a href="#" data-action="logout">Sign out</a>
  </header>
  <main class="container">
    <section class="panel">
      <h1>Pick-up inspection</h1>
      <p class="lead">Record the car's condition when the customer collects it. A saved report cannot be changed.</p>
      <form id="report-form" novalidate>
        <label for="booking-id">Booking ID
          <input id="booking-id" name="booking" required autocomplete="off" spellcheck="false">
        </label>
        <label for="mileage">Mileage (km)
          <input id="mileage" type="number" min="0" max="2000000" step="1" required>
        </label>
        <label for="fuel">Fuel level
          <select id="fuel" required>
            <option value="">Choose...</option>
            <option value="empty">Empty</option>
            <option value="quarter">1/4</option>
            <option value="half">1/2</option>
            <option value="three_quarter">3/4</option>
            <option value="full">Full</option>
          </select>
        </label>
        <label for="notes">Notes <span class="hint">(optional, up to 2000 characters)</span>
          <textarea id="notes" maxlength="2000"></textarea>
        </label>
        <label for="photos">Photos <span class="hint">(JPEG or PNG, up to 5 MB each, at most 6)</span>
          <input id="photos" type="file" accept="image/jpeg,image/png" multiple>
        </label>
        <button id="submit" type="submit">Save report</button>
      </form>
      <div id="result" class="status" role="status" hidden></div>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/inspection.js" data-page="pickup"></script>
</body>
</html>
