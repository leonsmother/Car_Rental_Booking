<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com https://*.execute-api.eu-central-1.amazonaws.com http://*.execute-api.localhost.floci.io:4566; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Book a car - CarRent Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">CarRent Cloud</a>
    <nav>
      <a href="/pages/search.html">Search cars</a>
      <a href="/pages/request-booking.html" data-role="customer" hidden>Book a car</a>
      <a href="/pages/my-bookings.html" data-role="customer" hidden>My bookings</a>
      <a href="/pages/staff-requests.html" data-role="staff" hidden>Booking requests</a>
      <a href="/pages/pickup.html" data-role="staff" hidden>Pick-up</a>
      <a href="/pages/return.html" data-role="staff" hidden>Return</a>
    </nav>
    <span class="who" data-user-email></span>
    <a href="#" data-action="logout">Sign out</a>
  </header>
  <main class="container">
    <section class="panel">
      <h1>Book a car</h1>
      <p class="lead">Choose a car and your dates. Your request goes to the car's office, and staff confirm it.</p>
      <form id="booking-form" novalidate>
        <label for="car">Car
          <select id="car" required>
            <option value="">Loading cars...</option>
          </select>
        </label>
        <div id="car-facts" hidden></div>
        <label for="start">Pick-up date
          <input id="start" type="date" required>
        </label>
        <label for="end">Return date
          <input id="end" type="date" required>
        </label>
        <p id="estimate" class="hint" hidden></p>
        <button id="submit" type="submit">Send booking request</button>
      </form>
      <div id="result" class="status" role="status" hidden></div>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/booking.js" data-page="request"></script>
</body>
</html>
