<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.s3.eu-central-1.amazonaws.com; connect-src 'self' https://*.amazoncognito.com https://*.execute-api.eu-central-1.amazonaws.com https://*.s3.eu-central-1.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <title>Sign in - CarRent Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="card">
    <h1>CarRent Cloud</h1>
    <p class="lead">Sign in to book a car or manage inspections.</p>
    <button id="btn-login" type="button">Sign in</button>
    <button id="btn-signup" type="button">Create an account</button>
    <p class="note">You will be sent to a secure Cognito page. We never see your password.</p>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js" data-page="login"></script>
</body>
</html>
