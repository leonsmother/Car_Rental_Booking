AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Booking service (Eman) - own API, Lambda and permissions

Parameters:
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID (from the auth stack outputs)
  UserPoolClientId:
    Type: String
    Description: Cognito App Client ID (from the auth stack outputs)
  CatalogueApiUrl:
    Type: String
    Default: ''
    Description: Catalogue API URL (from Jana's stack outputs)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 256

Resources:
  BookingApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        # Every route needs a valid login token unless it says Authorizer: NONE
        DefaultAuthorizer: CognitoJwt
        EnableIamAuthorizer: true   # lets internal routes accept IAM-signed calls from other services
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience:
                - !Ref UserPoolClientId

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/app.handler
      Environment:
        Variables:
          DATABASE_URL_PARAM: /car-rental/booking/DATABASE_URL
          CATALOGUE_API_URL: !Ref CatalogueApiUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/car-rental/booking/DATABASE_URL
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE   # public health check, no login needed
        ListBookings:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /bookings
            Method: GET
        CreateBooking:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /bookings
            Method: POST
        CancelBooking:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /bookings/{id}
            Method: DELETE
        DecideBooking:
          Type: HttpApi
          Properties:
            ApiId: !Ref BookingApi
            Path: /bookings/{id}/decision
            Method: PATCH

Outputs:
  BookingApiUrl:
    Description: Booking API URL (goes in frontend/js/config.js and the other services)
    Value: !Sub https://${BookingApi}.execute-api.${AWS::Region}.amazonaws.com