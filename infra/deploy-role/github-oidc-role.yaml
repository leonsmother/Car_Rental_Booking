AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC Provider and Least-Privilege SAM Deploy Role for Car Rental Booking

Parameters:
  GitHubRepo:
    Type: String
    Default: leonsmother/Car_Rental_Booking
    Description: GitHub repository in owner/repo format (shown in the role name and docs only)

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsSAMDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub's tokens use the numeric-ID form of the repository name.
                # "repo:leonsmother/Car_Rental_Booking:*" does NOT match, so keep the IDs.
                token.actions.githubusercontent.com:sub: "repo:leonsmother@279860471/Car_Rental_Booking@1461258255:*"
      Policies:
        - PolicyName: CarRentalSAMDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - s3:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - cognito-idp:*
                  - events:*
                  - sns:*
                  - sqs:*
                  - logs:*
                  - cloudwatch:*
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                Resource: "*"
              # Needed by the monitoring stack (monthly budget alert). Only budgets named car-rental-*.
              - Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/car-rental-*"

Outputs:
  DeployRoleArn:
    Description: ARN of the IAM Role for GitHub Actions
    Value: !GetAtt GitHubActionsDeployRole.Arn