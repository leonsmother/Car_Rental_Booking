AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CarRent Cloud - auth stack (Cognito user pool, groups, post-confirmation trigger). Deployed first.

Parameters:
  FrontendOrigin:
    Type: String
    Description: Vercel URL, no trailing slash (e.g. https://car-rental.vercel.app). Used for redirects.
  DomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito login page (lowercase letters, digits, hyphens)
  AuthDatabaseUrlParam:
    Type: String
    Default: /car-rental/auth/DATABASE_URL
    Description: SSM SecureString holding the auth_trigger_role connection string

Conditions:
  OriginIsLocal5500: !Equals [!Ref FrontendOrigin, 'http://localhost:5500']   # avoids a duplicate URL in the lists below

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: car-rental-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL            # users can enrol an authenticator app (TOTP); staff should
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false     # customers can sign up; staff are added to the staff group by an admin
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: customer
      Description: Customers (default for every new account)

  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: staff
      Description: Rental office staff (added manually by an admin)

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: car-rental-web
      GenerateSecret: false                 # browser app: PKCE replaces the secret
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]             # authorization code + PKCE, no implicit flow
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub '${FrontendOrigin}/callback.html'
        - http://localhost:3000/callback.html
        - !If [OriginIsLocal5500, !Ref 'AWS::NoValue', 'http://localhost:5500/callback.html']
      LogoutURLs:
        - !Sub '${FrontendOrigin}/login.html'
        - http://localhost:3000/login.html
        - !If [OriginIsLocal5500, !Ref 'AWS::NoValue', 'http://localhost:5500/login.html']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: post-confirmation/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DATABASE_URL_PARAM: !Ref AuthDatabaseUrlParam
      Policies:
        - Statement:
            - Effect: Allow                  # read ONLY its own database URL
              Action: ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthDatabaseUrlParam}'
            - Effect: Allow                  # put new users in the customer group
              Action: cognito-idp:AdminAddUserToGroup
              # Pool ARN cannot be used here (it would create a circular reference), so scope to this account's pools.
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: car-rental-auth-UserPoolId }
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export: { Name: car-rental-auth-UserPoolClientId }
  Issuer:
    Description: JWT authorizer issuer for the three service templates
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
    Export: { Name: car-rental-auth-Issuer }
  LoginDomain:
    Description: Cognito login page, for frontend/js/config.js
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
