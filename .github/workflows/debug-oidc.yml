name: Debug OIDC subject

on:
  push:
    paths: ['.github/workflows/debug-oidc.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Print the token claims AWS will see
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          node -e "const t=process.argv[1].split('.')[1];const c=JSON.parse(Buffer.from(t,'base64url'));console.log(JSON.stringify({sub:c.sub,aud:c.aud,repository:c.repository,repository_owner:c.repository_owner,ref:c.ref},null,2))" "$TOKEN"