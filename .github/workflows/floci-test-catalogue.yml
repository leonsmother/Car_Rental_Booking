# Floci test for Catalogue (owner: Jana) - runs on every PR that touches Catalogue
name: Floci test - catalogue

on:
  pull_request:
    paths:
      - "services/catalogue/**"
      - "compose.yaml"
      - ".github/workflows/floci-test-catalogue.yml"
      - ".github/workflows/_floci-test-service.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: floci-test-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_floci-test-service.yml
    with:
      service-dir: services/catalogue
      stack-name: car-rental-catalogue
      # Dummy Cognito values: Floci only needs them to build the JWT authorizer
      parameter-overrides: FrontendOrigin=http://localhost:5500 UserPoolId=eu-central-1_FLOCITEST UserPoolClientId=flocitestclient
      unsigned-check: POST /internal/quote
      