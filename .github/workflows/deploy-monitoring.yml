name: Deploy monitoring

on:
  push:
    branches: [main]
    paths:
      - "infra/monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service-dir: infra/monitoring
      stack-name: car-rental-monitoring
      node-project: false   # plain CloudFormation, nothing to npm install
      parameter-overrides: "AlertEmail=${{ vars.ALERT_EMAIL }}"

